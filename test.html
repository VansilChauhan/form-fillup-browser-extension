<!doctype html>
<html><body>
<h3>Env Form Fill test page</h3>
<form>
  <p><input name="first_name"></p>
  <p><input id="lastName"></p>
  <p><label>E-mail <input type="email"></label></p>
  <p><input placeholder="Phone"></p>
  <p><select aria-label="Country"><option>Canada</option><option>United States</option></select></p>
  <p><label for="sub">Subscribe</label> <input id="sub" type="checkbox"></p>
  <p>Preferred contact:
    <label><input type="radio" name="contact_method" value="e"> Email</label>
    <label><input type="radio" name="contact_method" value="p"> Phone</label>
  </p>
  <p><label>Birth date <input type="date"></label></p>
  <p><label>Appointment time <input type="time"></label></p>
  <p><input name="unrelated" value="untouched"></p>
</form>
</body></html>
